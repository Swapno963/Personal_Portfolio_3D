<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="msTitle">
  <title id="msTitle">MagicStream Go movie catalog architecture</title>
  <rect width="960" height="540" rx="24" fill="#0b0a1a"/>
  <rect x="24" y="24" width="912" height="492" rx="18" fill="#151030"/>
  <text x="48" y="68" fill="#aaa6c3" font-family="Poppins, Inter, Arial, sans-serif" font-size="16" letter-spacing="2">MAGICSTREAM / GO MOVIE CATALOG</text>
  <text x="48" y="104" fill="#ffffff" font-family="Poppins, Inter, Arial, sans-serif" font-size="24" font-weight="700">Same-origin API, JWT cookies, optional AI ranking</text>

  <rect x="56" y="150" width="200" height="100" rx="12" fill="#100d25" stroke="#915EFF"/>
  <text x="156" y="190" text-anchor="middle" fill="#ffffff" font-family="Poppins, Inter, Arial, sans-serif" font-size="17" font-weight="600">Static UI</text>
  <text x="156" y="216" text-anchor="middle" fill="#aaa6c3" font-family="Poppins, Inter, Arial, sans-serif" font-size="13">HTML / CSS / JS</text>

  <rect x="280" y="150" width="200" height="100" rx="12" fill="#100d25" stroke="#56ccf2"/>
  <text x="380" y="190" text-anchor="middle" fill="#ffffff" font-family="Poppins, Inter, Arial, sans-serif" font-size="17" font-weight="600">Gin API</text>
  <text x="380" y="216" text-anchor="middle" fill="#aaa6c3" font-family="Poppins, Inter, Arial, sans-serif" font-size="13">Auth middleware</text>

  <rect x="504" y="150" width="200" height="100" rx="12" fill="#100d25" stroke="#38ef7d"/>
  <text x="604" y="190" text-anchor="middle" fill="#ffffff" font-family="Poppins, Inter, Arial, sans-serif" font-size="17" font-weight="600">MongoDB 7</text>
  <text x="604" y="216" text-anchor="middle" fill="#aaa6c3" font-family="Poppins, Inter, Arial, sans-serif" font-size="13">Users / movies</text>

  <rect x="728" y="150" width="176" height="100" rx="12" fill="#100d25" stroke="#f5af19"/>
  <text x="816" y="182" text-anchor="middle" fill="#ffffff" font-family="Poppins, Inter, Arial, sans-serif" font-size="16" font-weight="600">OpenAI</text>
  <text x="816" y="206" text-anchor="middle" fill="#aaa6c3" font-family="Poppins, Inter, Arial, sans-serif" font-size="12">Optional ranking</text>
  <text x="816" y="226" text-anchor="middle" fill="#f5af19" font-family="Poppins, Inter, Arial, sans-serif" font-size="11">allow-list fallback</text>

  <polyline points="256,200 280,200" fill="none" stroke="#aaa6c3" stroke-width="2"/>
  <polyline points="480,200 504,200" fill="none" stroke="#aaa6c3" stroke-width="2"/>
  <polyline points="704,200 728,200" fill="none" stroke="#aaa6c3" stroke-width="2" stroke-dasharray="6 4"/>

  <rect x="56" y="290" width="272" height="88" rx="12" fill="#100d25" stroke="#915EFF"/>
  <text x="76" y="326" fill="#ffffff" font-family="Poppins, Inter, Arial, sans-serif" font-size="15" font-weight="600">Public</text>
  <text x="76" y="350" fill="#aaa6c3" font-family="Poppins, Inter, Arial, sans-serif" font-size="13">Catalog, auth, health / ready</text>

  <rect x="344" y="290" width="272" height="88" rx="12" fill="#100d25" stroke="#56ccf2"/>
  <text x="364" y="326" fill="#ffffff" font-family="Poppins, Inter, Arial, sans-serif" font-size="15" font-weight="600">Authenticated</text>
  <text x="364" y="350" fill="#aaa6c3" font-family="Poppins, Inter, Arial, sans-serif" font-size="13">Detail, trailers, recommendations</text>

  <rect x="632" y="290" width="272" height="88" rx="12" fill="#100d25" stroke="#38ef7d"/>
  <text x="652" y="326" fill="#ffffff" font-family="Poppins, Inter, Arial, sans-serif" font-size="15" font-weight="600">Admin</text>
  <text x="652" y="350" fill="#aaa6c3" font-family="Poppins, Inter, Arial, sans-serif" font-size="13">Add movie, update review</text>

  <rect x="56" y="406" width="848" height="78" rx="12" fill="#100d25" stroke="#aaa6c3"/>
  <text x="76" y="440" fill="#ffffff" font-family="Poppins, Inter, Arial, sans-serif" font-size="15" font-weight="600">HTTP-only JWT cookies · Docker Compose · GitHub Actions CI</text>
  <text x="76" y="464" fill="#aaa6c3" font-family="Poppins, Inter, Arial, sans-serif" font-size="13">Portfolio MVP  YouTube embeds, not a video CDN. Authorization lives in middleware.</text>
</svg>
