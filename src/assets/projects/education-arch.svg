<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="eduTitle">
  <title id="eduTitle">Education SaaS architecture</title>
  <rect width="960" height="540" rx="24" fill="#0b0a1a"/>
  <rect x="24" y="24" width="912" height="492" rx="18" fill="#151030"/>
  <text x="48" y="68" fill="#aaa6c3" font-family="Poppins, Inter, Arial, sans-serif" font-size="16" letter-spacing="2">EDUCATION INSTITUTIONS SAAS</text>
  <text x="48" y="104" fill="#ffffff" font-family="Poppins, Inter, Arial, sans-serif" font-size="26" font-weight="700">Nginx / Go API / Postgres / Redis / AWS</text>

  <rect x="380" y="140" width="200" height="56" rx="12" fill="#915EFF"/>
  <text x="480" y="175" text-anchor="middle" fill="#ffffff" font-family="Poppins, Inter, Arial, sans-serif" font-size="18" font-weight="600">Internet / Nginx</text>

  <rect x="160" y="250" width="240" height="72" rx="12" fill="#100d25" stroke="#915EFF"/>
  <text x="280" y="280" text-anchor="middle" fill="#ffffff" font-family="Poppins, Inter, Arial, sans-serif" font-size="18" font-weight="600">Next.js</text>
  <text x="280" y="304" text-anchor="middle" fill="#aaa6c3" font-family="Poppins, Inter, Arial, sans-serif" font-size="13">Admin / teacher / student UI</text>

  <rect x="560" y="250" width="240" height="72" rx="12" fill="#100d25" stroke="#915EFF"/>
  <text x="680" y="280" text-anchor="middle" fill="#ffffff" font-family="Poppins, Inter, Arial, sans-serif" font-size="18" font-weight="600">Go / Gin API</text>
  <text x="680" y="304" text-anchor="middle" fill="#aaa6c3" font-family="Poppins, Inter, Arial, sans-serif" font-size="13">Handler to repository</text>

  <rect x="80" y="400" width="180" height="64" rx="12" fill="#100d25" stroke="#38ef7d"/>
  <text x="170" y="438" text-anchor="middle" fill="#ffffff" font-family="Poppins, Inter, Arial, sans-serif" font-size="16">PostgreSQL</text>

  <rect x="290" y="400" width="180" height="64" rx="12" fill="#100d25" stroke="#56ccf2"/>
  <text x="380" y="428" text-anchor="middle" fill="#ffffff" font-family="Poppins, Inter, Arial, sans-serif" font-size="16">Redis</text>
  <text x="380" y="448" text-anchor="middle" fill="#aaa6c3" font-family="Poppins, Inter, Arial, sans-serif" font-size="12">Asynq workers</text>

  <rect x="500" y="400" width="180" height="64" rx="12" fill="#100d25" stroke="#fc6767"/>
  <text x="590" y="438" text-anchor="middle" fill="#ffffff" font-family="Poppins, Inter, Arial, sans-serif" font-size="16">S3 backups</text>

  <rect x="710" y="400" width="180" height="64" rx="12" fill="#100d25" stroke="#f5af19"/>
  <text x="800" y="428" text-anchor="middle" fill="#ffffff" font-family="Poppins, Inter, Arial, sans-serif" font-size="16">GHA to ECR</text>
  <text x="800" y="448" text-anchor="middle" fill="#aaa6c3" font-family="Poppins, Inter, Arial, sans-serif" font-size="12">Compose on EC2</text>

  <line x1="480" y1="196" x2="480" y2="230" stroke="#915EFF" stroke-width="2"/>
  <line x1="280" y1="230" x2="680" y2="230" stroke="#915EFF" stroke-width="2"/>
  <line x1="280" y1="230" x2="280" y2="250" stroke="#915EFF" stroke-width="2"/>
  <line x1="680" y1="230" x2="680" y2="250" stroke="#915EFF" stroke-width="2"/>
  <line x1="680" y1="322" x2="680" y2="360" stroke="#aaa6c3" stroke-width="2"/>
  <line x1="170" y1="360" x2="800" y2="360" stroke="#aaa6c3" stroke-width="2"/>
  <line x1="170" y1="360" x2="170" y2="400" stroke="#aaa6c3" stroke-width="2"/>
  <line x1="380" y1="360" x2="380" y2="400" stroke="#aaa6c3" stroke-width="2"/>
  <line x1="590" y1="360" x2="590" y2="400" stroke="#aaa6c3" stroke-width="2"/>
  <line x1="800" y1="360" x2="800" y2="400" stroke="#aaa6c3" stroke-width="2"/>
